name: Test skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python skills/proverka-blogerov/scripts/demo_screening.py --output output/screening
      - run: python -m unittest discover -s tests -v
      - run: python skills/proverka-blogerov/scripts/preflight.py
